[package]
name = "httpxp"
version = "0.28.1"
edition = "2024"
rust-version = "1.98"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
wreq = { version = "0.16.1", features = [
    "json",
    "multipart",
    "stream",
    "cookies",
    "socks",
    "ws",
] }
wreq-util = "0.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
bytes = "1"
